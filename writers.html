<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Writers - LanceNest</title>
    <meta name="description" content="Browse freelance writers on LanceNest. Find profiles, rates, and direct contact methods to hire the right writer for your project.">
    <link rel="canonical" href="https://x-sofia.github.io/lancenest/writers.html">
    <meta property="og:title" content="LanceNest — Browse Writers">
    <meta property="og:description" content="Browse vetted freelance writers and contact them directly to hire for your projects.">
    <meta property="og:url" content="https://x-sofia.github.io/lancenest/writers.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="google-site-verification" content="REPLACE_WITH_GOOGLE_VERIFICATION_CODE">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-wrap">
            <div class="logo" aria-label="LanceNest home">LanceNest</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="writers.html">Browse Writers</a></li>
                <li><a href="index.html#how-it-works">How it Works</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="search-section">
            <div class="container narrow-container">
                <span class="eyebrow">Find the right fit</span>
                <h1>Search talented writers by specialty.</h1>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by name, specialty, or skill..." class="search-input" aria-label="Search writers">
                    <select id="categoryFilter" class="category-filter" aria-label="Filter writers by category">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="writers-section">
            <div class="container">
                <div class="writers-grid" id="writersGrid" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <div id="contact-modal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="contact-title">
            <button class="modal-close" id="contact-close" type="button" aria-label="Close contact modal">×</button>
            <h3 id="contact-title">Contact Writer</h3>
            <div id="contact-body"></div>
        </div>
    </div>

    <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

    <footer class="footer">
        <div class="container footer-inner">
            <p>&copy; 2026 LanceNest. All rights reserved.</p>
            <p>Founded by Sofia Wolf</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
