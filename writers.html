<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Writers - LanceNest</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">LanceNest</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="writers.html">Browse Writers</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Search Section -->
    <section class="search-section">
        <div class="container">
            <h1>Find Your Perfect Writer</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name, specialty, or skill..." class="search-input">
                <select id="categoryFilter" class="category-filter">
                    <option value="">All Categories</option>
                    <option value="Blog Writing">Blog Writing</option>
                    <option value="Copywriting">Copywriting</option>
                    <option value="Technical Writing">Technical Writing</option>
                    <option value="Social Media">Social Media Content</option>
                    <option value="Editing">Editing & Proofreading</option>
                    <option value="Creative">Creative Writing</option>
                    <option value="Email">Email & Newsletters</option>
                    <option value="Resume">Resume Writing</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Writers Grid -->
    <section class="writers-section">
        <div class="container">
            <div class="writers-grid" id="writersGrid">
                <!-- Writers will be loaded here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Contact Modal -->
    <div id="contact-modal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="contact-title">
        <button class="modal-close" id="contact-close">×</button>
        <h3 id="contact-title">Contact Writer</h3>
        <div id="contact-body">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 LanceNest. All rights reserved.</p>
            <p>Founded by Sofia Wolf</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
